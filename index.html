<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Leva – Allenamento a casa</title>
<style>
:root{
  --bg:#0E0F12;--s1:#16181D;--s2:#1E2128;--s3:#272B33;--line:#2C3039;
  --tx:#F2F3F5;--mu:#8B909A;--mu2:#5E636D;
  --ac:#C6F432;--ac-ink:#14180A;--ac2:#FF6B35;--ok:#4ADE80;
  --r:18px;--r-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tx)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:28px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
#app{max-width:560px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.muted{color:var(--mu)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.hero{background:linear-gradient(160deg,#1D2214 0%,var(--s1) 60%);border-color:#33401A}
.hero h2{margin:6px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.chip{font-size:13px;background:var(--s2);border:1px solid var(--line);color:#C9CDD4;padding:5px 10px;border-radius:999px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ac);color:var(--ac-ink)}
.btn.ghost{background:var(--s2);border:1px solid var(--line)}
.btn.danger{background:#2A1614;color:#FF8A7A;border:1px solid #4A221D}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat b small{font-size:13px;color:var(--mu);font-weight:600}
.bar{height:10px;background:var(--s3);border-radius:99px;overflow:hidden;margin:10px 0 8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#E4FF7A);border-radius:99px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{flex:none;width:36px;height:36px;border-radius:10px;background:#2A1C12;color:var(--ac2);display:grid;place-items:center}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0;padding-top:2px}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--s3);color:#C9CDD4;white-space:nowrap}
.badge.ac{background:#2B3510;color:var(--ac)}
.empty{color:var(--mu);font-size:14px;padding:18px 0;text-align:center}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--s3)}
.heat i.on{background:var(--ac)}
.heat i.today{outline:2px solid var(--mu2);outline-offset:1px}
.heat-l{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;font-size:11px;color:var(--mu);text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:6px}
.field input{width:100%;height:50px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:none}
.field input:focus{border-color:var(--ac)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.tog{flex:none;width:52px;height:30px;border-radius:99px;background:var(--s3);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--ac)}
.tog.on::after{transform:translateX(22px);background:var(--ac-ink)}
/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center}
#tabbar .in{display:flex;max-width:560px;width:100%}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mu2)}
#tabbar button.on{color:var(--ac)}
#tabbar svg{width:24px;height:24px}
body.full #tabbar{display:none}
/* session */
.sess-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;text-align:center}
.dots{display:flex;gap:5px;margin-bottom:16px}
.dots i{flex:1;height:5px;border-radius:9px;background:var(--s3)}
.dots i.done{background:var(--ac)}
.dots i.cur{background:#7C8C3A}
.lvl{display:flex;align-items:center;gap:8px;margin:12px 0}
.lvl button{width:34px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:18px;font-weight:700}
.lvl button:disabled{opacity:.3}
.lvl-steps{display:flex;gap:4px;flex:1}
.lvl-steps i{flex:1;height:6px;border-radius:9px;background:var(--s3)}
.lvl-steps i.on{background:var(--ac)}
.desc{color:#C2C6CE;font-size:15px}
.note{margin-top:8px;font-size:14px;color:var(--ac2)}
.target{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.set{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-top:10px;transition:background .2s,border-color .2s}
.set.done{background:#1C2410;border-color:#3A4A16}
.set .n{width:26px;font-weight:800;color:var(--mu)}
.stepper{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:11px;background:var(--s3);font-size:22px;font-weight:600;line-height:1}
.stepper .v{min-width:74px;text-align:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper .v small{font-size:13px;color:var(--mu);font-weight:600;margin-left:3px}
.check{width:46px;height:46px;border-radius:13px;background:var(--s3);display:grid;place-items:center;color:var(--mu)}
.check svg{width:22px;height:22px}
.set.done .check{background:var(--ac);color:var(--ac-ink)}
.sess-nav{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%)}
.sess-nav .row{max-width:528px;margin:0 auto}
.sess-nav .row>.ghost{flex:0 0 120px}
/* rest */
#rest{position:fixed;inset:0;z-index:40;background:rgba(10,11,13,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#rest.show{display:flex}
.ring{position:relative;width:240px;height:240px;margin:18px 0 26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#rest .row{width:100%;max-width:340px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + var(--safe-b));animation:up .25s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow:auto}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translate(-50%,-140%);z-index:60;background:var(--tx);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.lib-lv{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lib-lv:first-of-type{border-top:0}
.lib-lv .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mu)}
.lib-lv.cur .num{background:var(--ac);color:var(--ac-ink)}
.lib-lv .t{font-weight:600}
.big-ok{width:84px;height:84px;border-radius:26px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin:30px auto 18px}
.big-ok svg{width:44px;height:44px}
.center{text-align:center}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.onb-logo{width:64px;height:64px;border-radius:18px;margin:10px 0 18px}
a{color:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabbar"><div class="in">
  <button data-a="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Oggi</button>
  <button data-a="tab" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16l4-5 4 3 5-7"/></svg>Progressi</button>
  <button data-a="tab" data-v="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Esercizi</button>
  <button data-a="tab" data-v="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profilo</button>
</div></nav>
<div id="rest">
  <div class="eyebrow">Recupero</div>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#272B33" stroke-width="6"/><circle id="ringFg" cx="50" cy="50" r="45" fill="none" stroke="#C6F432" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
    <div class="t" id="restT">1:30</div>
  </div>
  <div class="muted small" id="restNext" style="margin-bottom:18px;text-align:center"></div>
  <div class="row">
    <button class="btn ghost" data-a="restAdd" data-v="-15">−15 s</button>
    <button class="btn ghost" data-a="restAdd" data-v="15">+15 s</button>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn primary" data-a="restSkip">Salta recupero</button></div>
</div>
<div id="sheet"><div class="bg" data-a="closeSheet"></div><div class="pane"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>

<script>
(function () {
'use strict';

/* ---------- Dati: esercizi e progressioni ---------- */
const LADDERS = {
  push_h: { name: 'Spinta orizzontale', levels: [
    { n: 'Piegamenti classici', d: 'Mani poco più larghe delle spalle, corpo dritto come una tavola. Scendi finché il petto è a un pugno da terra.' },
    { n: 'Piegamenti a piedi rialzati', d: 'Piedi su una sedia, mani a terra. Più sono alti i piedi, più lavorano spalle e petto alto.' },
    { n: 'Piegamenti con elastico', d: 'Elastico dietro la schiena, estremità bloccate sotto le mani. In alternativa uno zaino carico sulla schiena.' },
    { n: 'Piegamenti ad arciere', d: 'Mani molto larghe: scendi verso un lato tenendo l’altro braccio quasi teso. Alterna i lati.' },
    { n: 'Pseudo-planche', d: 'Mani all’altezza della vita con le dita verso i piedi, spalle spostate in avanti oltre le mani.' } ] },
  push_v: { name: 'Spinta verticale', levels: [
    { n: 'Pike push-up', d: 'Bacino in alto, corpo a V rovesciata. Piega le braccia portando la testa davanti alle mani.' },
    { n: 'Pike a piedi rialzati', d: 'Come il pike, ma con i piedi su una sedia: il busto è più verticale e il carico sulle spalle aumenta.' },
    { n: 'Verticale al muro', d: 'Pancia verso il muro, braccia tese, corpo dritto. Tieni la posizione.', u: 's', r: [20, 45] },
    { n: 'Piegamenti in verticale, negativi', d: 'In verticale al muro scendi in 4–5 secondi fino a sfiorare il pavimento con la testa, poi rientra.', r: [3, 6] },
    { n: 'Piegamenti in verticale', d: 'In verticale al muro: scendi controllato e spingi fino a braccia tese.', r: [3, 8] } ] },
  row: { name: 'Tirata orizzontale', levels: [
    { n: 'Rematore al tavolo, ginocchia piegate', d: 'Sdraiato sotto un tavolo pesante e stabile, mani sul bordo. Tira il petto al bordo stringendo le scapole. Solo con un tavolo che non si ribalta.' },
    { n: 'Rematore al tavolo, gambe tese', d: 'Come prima ma con le gambe tese: corpo dritto dai talloni alle spalle.' },
    { n: 'Rematore al tavolo, piedi rialzati', d: 'Piedi su una sedia, corpo orizzontale. Tira fino a toccare il bordo con il petto.' },
    { n: 'Rematore al tavolo, pausa 2 s', d: 'Gambe tese o piedi rialzati: in alto tieni 2 secondi con le scapole strette.' },
    { n: 'Rematore a un braccio, assistito', d: 'Tira con un braccio, l’altro aiuta il minimo indispensabile sul bordo.' } ] },
  squat: { name: 'Squat', levels: [
    { n: 'Squat a corpo libero', d: 'Piedi alla larghezza delle spalle, scendi sotto il parallelo con il busto alto.' },
    { n: 'Squat bulgaro', d: 'Piede posteriore su una sedia. Scendi portando il ginocchio dietro verso terra, spingi col tallone davanti.' },
    { n: 'Squat bulgaro con zaino', d: 'Come il bulgaro, con uno zaino carico (5–15 kg) in spalla.' },
    { n: 'Pistol squat su sedia', d: 'Su una gamba, l’altra tesa in avanti. Siediti lentamente sulla sedia e rialzati senza slancio.' },
    { n: 'Pistol squat', d: 'Squat completo su una gamba sola, senza appoggi. Discesa controllata.' } ] },
  hinge: { name: 'Femorali e glutei', levels: [
    { n: 'Ponte glutei', d: 'Supino, piedi a terra. Spingi il bacino in alto e stringi i glutei per 1 secondo.' },
    { n: 'Hip thrust su una gamba', d: 'Schiena appoggiata al bordo del divano, un piede a terra. Spingi col tallone fino ad allineare busto e coscia.' },
    { n: 'Nordic curl negativo', d: 'In ginocchio su un cuscino, caviglie bloccate sotto il divano. Scendi in avanti il più lentamente possibile, frena con le mani.', r: [4, 8] },
    { n: 'Nordic curl con spinta delle mani', d: 'Scendi lento e risali spingendo con le mani il minimo indispensabile.', r: [4, 8] },
    { n: 'Nordic curl completo', d: 'Scendi e risali usando solo i femorali.', r: [3, 6] } ] },
  core: { name: 'Core', u: 's', levels: [
    { n: 'Plank', d: 'Avambracci a terra, corpo dritto, glutei e addome contratti. Non far cadere il bacino.', r: [30, 60] },
    { n: 'Hollow body hold', d: 'Supino, zona lombare incollata al pavimento, braccia e gambe tese sollevate da terra.', r: [20, 40] },
    { n: 'L-sit tra due sedie, gambe piegate', d: 'Mani su due sedie, braccia tese, spingi giù le spalle e solleva le ginocchia al petto.', r: [10, 30] },
    { n: 'L-sit, una gamba tesa', d: 'Come prima, con una gamba tesa in avanti. Alterna a ogni serie.', r: [10, 25] },
    { n: 'L-sit completo', d: 'Gambe tese parallele al pavimento, braccia tese.', r: [10, 30] } ] },
  pull: { name: 'Trazioni (sbarra)', levels: [
    { n: 'Trazioni negative', d: 'Sali con un salto fino al mento sopra la sbarra, poi scendi in 5 secondi fino a braccia tese.', r: [4, 6] },
    { n: 'Trazioni assistite con elastico', d: 'Elastico agganciato alla sbarra, sotto il piede o il ginocchio. Movimento completo.', r: [6, 10] },
    { n: 'Trazioni complete', d: 'Presa prona poco più larga delle spalle, da braccia tese al mento sopra la sbarra.', r: [4, 8] },
    { n: 'Trazioni con zaino', d: 'Come le complete, con uno zaino carico in spalla.', r: [4, 8] },
    { n: 'Trazioni ad arciere', d: 'Presa larga: tira verso una mano tenendo l’altro braccio quasi teso.', r: [3, 6] } ] },
  chin: { name: 'Chin-up (sbarra)', levels: [
    { n: 'Chin-up negativi', d: 'Presa supina, sali con un salto e scendi in 5 secondi.', r: [4, 6] },
    { n: 'Chin-up assistiti con elastico', d: 'Presa supina alla larghezza delle spalle, con l’elastico sotto il piede.', r: [6, 10] },
    { n: 'Chin-up completi', d: 'Presa supina, petto verso la sbarra, gomiti verso i fianchi.', r: [4, 8] },
    { n: 'Chin-up con zaino', d: 'Come i completi, con uno zaino carico.', r: [4, 8] } ] },
  hang_core: { name: 'Core alla sbarra', levels: [
    { n: 'Alzate delle ginocchia alla sbarra', d: 'Appeso, porta le ginocchia al petto senza dondolare e scendi lento.', r: [8, 15] },
    { n: 'Alzate delle gambe tese', d: 'Appeso, solleva le gambe tese fino a 90 gradi.', r: [6, 12] },
    { n: 'Toes to bar', d: 'Porta le punte dei piedi a toccare la sbarra, controllando la discesa.', r: [5, 10] } ] },
  curl_band: { name: 'Bicipiti', levels: [{ n: 'Curl bicipiti con elastico', d: 'Elastico sotto i piedi, gomiti fermi ai fianchi. Sali in 1 secondo, scendi in 3.' }] },
  row_band: { name: 'Dorsali', levels: [{ n: 'Rematore con elastico', d: 'Elastico ancorato alla maniglia di una porta chiusa a chiave, o sotto i piedi. Tira i gomiti indietro stringendo le scapole.' }] },
  pulldown_band: { name: 'Dorsali', levels: [{ n: 'Lat pulldown con elastico', d: 'Elastico ancorato in alto alla porta. In ginocchio, tira verso il petto portando i gomiti ai fianchi.' }] },
  dip: { name: 'Tricipiti e petto', levels: [{ n: 'Dip tra due sedie', d: 'Due sedie stabili ai lati, braccia tese. Scendi finché le spalle arrivano all’altezza dei gomiti, poi spingi.' }] },
  calf: { name: 'Polpacci', levels: [{ n: 'Polpacci su un gradino, una gamba', d: 'Avampiede sul bordo, scendi col tallone sotto il gradino, sali sulle punte e tieni 1 secondo.' }] },
  lunge: { name: 'Gambe', levels: [{ n: 'Affondi indietro con zaino', d: 'Zaino carico in spalla. Fai un passo indietro e porta il ginocchio posteriore verso terra, busto dritto.' }] },

/* ---------- Stato e salvataggio ---------- */
const KEY = 'leva.v1';
function fresh() { return { v: 1, profile: null, prog: {}, sessions: [], weights: [], active: null }; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return Object.assign(fresh(), s); } } catch (e) {}
  return fresh();
}

/* ---------- Utilità ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dkey = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dkey(new Date());
const parseD = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const dayN = (k) => Math.round(parseD(k).getTime() / 864e5);
function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const fmtD = (k) => parseD(k).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
const fmt1 = (n) => (Math.round(n * 10) / 10).toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mmss = (s) => Math.floor(s / 60) + ':' + pad(s % 60);
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',
  food: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 4-3 7h3v11"/></svg>'
};

function slotsFor(wid) { const bar = S.profile && S.profile.bar; return WORKOUTS[wid].slots.map((s) => (bar && s.bar ? s.bar : s)); }
const pkey = (slot) => slot.pk || slot.id;
function lvlOf(slot) { const p = S.prog[pkey(slot)]; const i = p ? p.lvl : slot.start; return clamp(i, 0, LADDERS[slot.l].levels.length - 1); }
function info(slot, i) {
  const L = LADDERS[slot.l]; const lv = L.levels[i];
  return { name: lv.n, desc: lv.d, u: lv.u || L.u || '', r: lv.r || slot.r, n: L.levels.length, cat: L.name };
}
const unitLbl = (u) => (u === 's' ? 's' : 'rip');
function nextWid() { const last = S.sessions[S.sessions.length - 1]; return last ? ORDER[(ORDER.indexOf(last.wid) + 1) % ORDER.length] : 'A'; }
function sessionsThisWeek() { const ws = dkey(weekStart(new Date())); return S.sessions.filter((s) => dkey(weekStart(parseD(s.d))) === ws).length; }
function streakWeeks() {
  const target = (S.profile && S.profile.days) || 3;
  const counts = {};
  S.sessions.forEach((s) => { const k = dkey(weekStart(parseD(s.d))); counts[k] = (counts[k] || 0) + 1; });
  let w = weekStart(new Date()); let n = 0;
  if ((counts[dkey(w)] || 0) < target) w.setDate(w.getDate() - 7);
  while ((counts[dkey(w)] || 0) >= target) { n++; w.setDate(w.getDate() - 7); }
  return n;
}
function curWeight() { const w = S.weights; return w.length ? w[w.length - 1].kg : (S.profile ? S.profile.weight : 0); }
function startWeight() { return S.profile ? S.profile.weight : (S.weights.length ? S.weights[0].kg : 0); }
function weightTrend() {
  const w = S.weights; if (w.length < 4) return null;
  const last = dayN(w[w.length - 1].d);
  const avg = (a, b) => { const xs = w.filter((e) => { const d = last - dayN(e.d); return d >= a && d < b; }).map((e) => e.kg); return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null; };
  const r = avg(0, 7), p = avg(7, 14); if (r == null || p == null) return null;
  const diff = r - p; return diff < 0.1 ? 'flat' : diff > 0.5 ? 'fast' : 'ok';
}

/* ---------- Grafici ---------- */
function lineChart(pts, opt) {
  opt = opt || {};
  if (pts.length < 2) return '<div class="empty">Servono almeno 2 misurazioni per vedere il grafico.</div>';
  const W = 330, H = opt.h || 150, pl = 36, pr = 10, pt = 12, pb = 24;
  const ys = pts.map((p) => p.y); if (opt.goal != null) ys.push(opt.goal);
  let y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  if (y1 - y0 < 1) { y0 -= 0.5; y1 += 0.5; }
  const py = (y1 - y0) * 0.12; y0 -= py; y1 += py;
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x;
  const X = (x) => pl + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - pl - pr);
  const Y = (y) => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ' L' + X(x1).toFixed(1) + ' ' + (H - pb) + ' L' + X(x0).toFixed(1) + ' ' + (H - pb) + ' Z';
  let grid = '';
  for (let i = 0; i <= 2; i++) {
    const v = y0 + ((y1 - y0) * i) / 2; const y = Y(v).toFixed(1);
    grid += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#272B33"/><text x="' + (pl - 6) + '" y="' + y + '" dy="4" text-anchor="end" font-size="10" fill="#8B909A">' + fmt1(v) + '</text>';
  }
  let goal = '';
  if (opt.goal != null) { const gy = Y(opt.goal).toFixed(1); goal = '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + gy + '" y2="' + gy + '" stroke="#FF6B35" stroke-dasharray="4 4"/><text x="' + (W - pr) + '" y="' + gy + '" dy="-5" text-anchor="end" font-size="10" fill="#FF6B35">obiettivo</text>'; }
  const lp = pts[pts.length - 1];
  const xl = '<text x="' + pl + '" y="' + (H - 6) + '" font-size="10" fill="#8B909A">' + esc(opt.l0 || '') + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" fill="#8B909A">' + esc(opt.l1 || '') + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Grafico"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6F432" stop-opacity=".28"/><stop offset="1" stop-color="#C6F432" stop-opacity="0"/></linearGradient></defs>' + grid + '<path d="' + area + '" fill="url(#ga)"/><path d="' + line + '" fill="none" stroke="#C6F432" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + goal + '<circle cx="' + X(lp.x).toFixed(1) + '" cy="' + Y(lp.y).toFixed(1) + '" r="4.5" fill="#C6F432" stroke="#16181D" stroke-width="2"/>' + xl + '</svg>';
}
function spark(vals) {
  if (vals.length < 2) return '';
  const W = 70, H = 26; const a = Math.min.apply(null, vals), b = Math.max.apply(null, vals); const rg = b - a || 1;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + ((i / (vals.length - 1)) * (W - 4) + 2).toFixed(1) + ' ' + (H - 3 - ((v - a) / rg) * (H - 6)).toFixed(1)).join(' ');
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + d + '" fill="none" stroke="#C6F432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

  const p = S.profile; const w = S.weights;
  let h = '<div class="top"><h1>Progressi</h1></div>';
  h += '<section class="card"><div class="card-h"><div><div class="eyebrow">Peso corporeo</div><h3 style="margin-top:4px">' + fmt1(curWeight()) + ' kg</h3></div><button class="btn ghost sm" data-a="weightSheet">+ Peso</button></div>' +
    lineChart(w.map((e) => ({ x: dayN(e.d), y: e.kg })), { goal: p.goal, l0: w.length ? fmtD(w[0].d) : '', l1: w.length ? fmtD(w[w.length - 1].d) : '' });
  if (w.length) h += '<div style="margin-top:10px">' + w.slice(-4).reverse().map((e) => '<div class="list-row"><div class="grow">' + fmtD(e.d) + '</div><b>' + fmt1(e.kg) + ' kg</b><button class="icon-btn" style="width:34px;height:34px" data-a="delWeight" data-v="' + e.d + '" aria-label="Elimina">' + ICON.x + '</button></div>').join('') + '</div>';
  h += '</section>';
  // frequenza
  const done = {}; S.sessions.forEach((s) => { done[s.d] = 1; });
  const ws = weekStart(new Date()); ws.setDate(ws.getDate() - 7 * 7); let cells = '';
  const tk = today();
  for (let i = 0; i < 56; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); const k = dkey(d); cells += '<i class="' + (done[k] ? 'on ' : '') + (k === tk ? 'today' : '') + '" title="' + k + '"></i>'; }
  h += '<section class="card"><div class="card-h"><h3>Ultime 8 settimane</h3><span class="badge">' + S.sessions.length + (S.sessions.length === 1 ? ' allenamento' : ' allenamenti') + '</span></div><div class="heat-l"><span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span></div><div class="heat">' + cells + '</div></section>';
  // esercizi
  h += '<section class="card"><h3 style="margin-bottom:10px">Esercizi</h3>';
  let any = false;
  ORDER.forEach((wid) => {
    slotsFor(wid).forEach((slot) => {
      const hist = []; S.sessions.forEach((s) => s.ex.forEach((e) => { if (e.id === slot.id) { const t = e.reps.reduce((a, r) => a + (r || 0), 0); if (t) hist.push({ lvl: e.lvl, t: t, reps: e.reps }); } }));
      const i = lvlOf(slot); const inf = info(slot, i); const last = hist[hist.length - 1];
      if (hist.length) any = true;
      h += '<div class="list-row"><span class="badge">' + wid + '</span><div class="grow"><div class="t">' + esc(inf.name) + '</div><div class="muted small">' + (inf.n > 1 ? 'Liv. ' + (i + 1) + '/' + inf.n + ' · ' : '') + (last ? 'ultima: ' + last.reps.map((r) => (r == null ? '–' : r)).join(' · ') + ' ' + unitLbl(info(slot, last.lvl).u) : 'non ancora fatto') + '</div></div>' + spark(hist.slice(-12).map((x) => x.t)) + '</div>';
    });
  });
  if (!any) h += '<p class="muted small" style="margin-top:8px">Dopo il primo allenamento qui vedrai livello, ultime ripetizioni e andamento di ogni esercizio.</p>';
  h += '</section>';
  // storico
  h += '<section class="card"><h3 style="margin-bottom:10px">Storico</h3>' + (S.sessions.length ? S.sessions.slice(-10).reverse().map((s) => '<div class="list-row"><span class="badge ac">' + s.wid + '</span><div class="grow"><div class="t">' + esc(WORKOUTS[s.wid].name) + '</div><div class="muted small">' + fmtD(s.d) + ' · ' + s.dur + ' min · ' + s.vol + ' rip</div></div></div>').join('') : '<div class="empty">Nessun allenamento ancora.</div>') + '</section>';
  return h;
}

function vLibrary() {
  const bar = S.profile.bar;
  const used = {};
  ORDER.forEach((wid) => WORKOUTS[wid].slots.forEach((s) => { [s].concat(s.bar ? [s.bar] : []).forEach((x) => { (used[x.l] = used[x.l] || []).push(x); }); }));
  let h = '<div class="top"><div><h1>Esercizi</h1><p class="muted small" style="margin-top:6px">Quando completi tutte le serie al massimo del range, passi al livello successivo.</p></div></div>';
  const main = Object.keys(LADDERS).filter((k) => LADDERS[k].levels.length > 1);
  const acc = Object.keys(LADDERS).filter((k) => LADDERS[k].levels.length === 1);
  main.forEach((k) => {
    const L = LADDERS[k]; const slots = used[k] || []; const isBar = k === 'pull' || k === 'chin' || k === 'hang_core';
    const curs = slots.map((s) => lvlOf(s));
    h += '<section class="card"><div class="card-h"><h3>' + esc(L.name) + '</h3>' + (isBar ? '<span class="badge' + (bar ? ' ac' : '') + '">' + (bar ? 'attivo' : 'con sbarra') + '</span>' : '<span class="badge">' + slots.map((s) => s.id[0]).join(' · ') + '</span>') + '</div>' +
      L.levels.map((lv, i) => '<div class="lib-lv ' + (curs.indexOf(i) >= 0 && (!isBar || bar) ? 'cur' : '') + '"><span class="num">' + (i + 1) + '</span><div><div class="t">' + esc(lv.n) + '</div><div class="muted small">' + esc(lv.d) + '</div></div></div>').join('') + '</section>';
  });
  h += '<section class="card"><h3 style="margin-bottom:6px">Complementari</h3>' + acc.map((k) => { const lv = LADDERS[k].levels[0]; return '<div class="lib-lv"><span class="num">·</span><div><div class="t">' + esc(lv.n) + '</div><div class="muted small">' + esc(lv.d) + '</div></div></div>'; }).join('') + '</section>';
  return h;
}

function vProfile() {
  const p = S.profile;
  let h = '<div class="top"><h1>Profilo</h1></div><div class="card">' +
    field('fName', 'Nome', 'text', p.name) +
    '<div class="row">' + field('fH', 'Altezza (cm)', 'number', p.height) + field('fG', 'Obiettivo (kg)', 'number', p.goal, '', '0.1') + '</div>' +
    '<div class="field"><label>Allenamenti a settimana</label><div class="seg" id="fDays">' + [3, 4].map((d) => '<button data-a="segDays" data-v="' + d + '" class="' + (p.days === d ? 'on' : '') + '">' + d + ' giorni</button>').join('') + '</div></div>' +
    '<div class="switch"><div><b>Ho una sbarra per trazioni</b><div class="muted small">Sostituisce rematori e plank con trazioni, chin-up e alzate alla sbarra</div></div><button class="tog ' + (p.bar ? 'on' : '') + '" id="fBar" data-a="togBar" aria-label="Sbarra"></button></div>' +
    '<div style="height:10px"></div><button class="btn primary" data-a="saveProfile">Salva modifiche</button></div>';
  if (deferredInstall) h += '<button class="btn ghost" style="margin-bottom:14px" data-a="install">Installa l’app sul telefono</button>';
  h += '<section class="card"><h3 style="margin-bottom:6px">Dati</h3><p class="muted small" style="margin-bottom:14px">I dati restano solo su questo telefono. Fai un backup ogni tanto.</p>' +
    '<div class="row"><button class="btn ghost" data-a="export">Esporta backup</button><button class="btn ghost" data-a="import">Importa backup</button></div>' +
    '<button class="btn danger" style="margin-top:10px" data-a="resetAsk">Cancella tutti i dati</button></section>' +
    '<p class="muted small center" style="margin:8px 0 20px">Leva · versione 1.0</p>';
  return h;
}

/* ---------- Render ---------- */
function render() {
  const full = !S.profile || route === 'session' || route === 'summary';
  document.body.classList.toggle('full', full);
  let html;
  if (!S.profile) html = vOnboard();
  else if (route === 'session' && S.active) html = vSession();
  else if (route === 'summary' && summary) html = vSummary();
  else { if (route === 'session' || route === 'summary') route = 'home'; html = ({ home: vHome, progress: vProgress, library: vLibrary, profile: vProfile })[route](); }
  $('#app').innerHTML = html;
  document.querySelectorAll('#tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.v === route));
}
function go(r) { route = r; render(); window.scrollTo(0, 0); }

/* ---------- Sheet e toast ---------- */
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('show'); }
function closeSheet() { $('#sheet').classList.remove('show'); }
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- Timer di recupero ---------- */
let rest = null; let actx = null;
function ensureAudio() { try { if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  if (!actx) return;
  try {
    [0, 0.22, 0.44].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
      o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) {}
}
function startRest(sec, nextTxt) {
  stopRest(); rest = { end: Date.now() + sec * 1000, total: sec, iv: setInterval(tickRest, 250) };
  $('#restNext').textContent = nextTxt || ''; $('#rest').classList.add('show'); tickRest();
}
function tickRest() {
  if (!rest) return;
  const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
  $('#restT').textContent = mmss(left);
  $('#ringFg').setAttribute('stroke-dashoffset', (282.74 * (1 - left / rest.total)).toFixed(1));
  if (left <= 0) { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} beep(); stopRest(); toast('Recupero finito: prossima serie!'); }
}
function stopRest() { if (rest) clearInterval(rest.iv); rest = null; $('#rest').classList.remove('show'); }

let wake = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) {}
}

/* ---------- Logica allenamento ---------- */
function startSession(wid) {
  const slots = slotsFor(wid);
  S.active = { wid: wid, start: Date.now(), idx: 0, ex: slots.map((s) => {
    const i = lvlOf(s); const inf = info(s, i); const p = S.prog[pkey(s)]; const last = p && p.lvl === i && p.last ? p.last : null;
    return { id: s.id, lvl: i, sets: Array.from({ length: s.sets }, (_, k) => ({ v: last && last[k] != null ? last[k] : inf.r[0], done: false })) };
  }) };
  save(); keepAwake(true); go('session');
}
function finishSession() {
  const a = S.active; const ups = []; let vol = 0; let anyDone = false;
  a.ex.forEach((e) => {
    const slot = SLOT[e.id]; const inf = info(slot, e.lvl); const done = e.sets.filter((s) => s.done);
    if (!done.length) return; anyDone = true;
    if (inf.u !== 's') done.forEach((s) => { vol += s.v; });
    const reps = e.sets.map((s) => (s.done ? s.v : null));
    const maxed = e.sets.every((s) => s.done && s.v >= inf.r[1]);
    let lvl = e.lvl;
    if (maxed) { if (lvl < inf.n - 1) { lvl++; ups.push({ from: inf.name, to: LADDERS[slot.l].levels[lvl].n }); } else ups.push({ max: true, name: inf.name }); }
    S.prog[pkey(slot)] = { lvl: lvl, last: lvl === e.lvl ? reps : null };
  });
  if (!anyDone) { S.active = null; save(); keepAwake(false); toast('Nessuna serie completata: allenamento non salvato'); go('home'); return; }
  const s = { d: today(), wid: a.wid, dur: Math.max(1, Math.round((Date.now() - a.start) / 60000)), vol: vol, ex: a.ex.map((e) => ({ id: e.id, lvl: e.lvl, reps: e.sets.map((x) => (x.done ? x.v : null)) })) };
  S.sessions.push(s); S.active = null; save(); keepAwake(false); stopRest();
  summary = { s: s, ups: ups }; go('summary');
}

/* ---------- Azioni ---------- */
let deferredInstall = null;
const readNum = (id) => parseFloat(String(($('#' + id) || {}).value || '').replace(',', '.'));
const A = {
  tab: (t) => { summary = null; go(t.dataset.v); },
  segDays: (t) => { t.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === t)); },
  togBar: (t) => { t.classList.toggle('on'); },
  onboard: () => {
    const name = ($('#fName').value || '').trim().slice(0, 30);
    const h = readNum('fH'), w = readNum('fW'), g = readNum('fG');
    if (!(h >= 120 && h <= 230)) return toast('Inserisci un’altezza valida (cm)');
    if (!(w >= 30 && w <= 200)) return toast('Inserisci un peso valido (kg)');
    if (!(g >= 30 && g <= 200)) return toast('Inserisci un obiettivo valido (kg)');
    const on = document.querySelector('#fDays .on');
    S.profile = { name: name, height: h, weight: w, goal: g, days: on ? +on.dataset.v : 3, bar: $('#fBar').classList.contains('on') };
    S.weights = [{ d: today(), kg: w }]; save(); go('home');
  },
  saveProfile: () => {
    const h = readNum('fH'), g = readNum('fG');
    if (!(h >= 120 && h <= 230)) return toast('Inserisci un’altezza valida (cm)');
    if (!(g >= 30 && g <= 200)) return toast('Inserisci un obiettivo valido (kg)');
    if (S.active) return toast('Termina prima l’allenamento in corso');
    const on = document.querySelector('#fDays .on');
    Object.assign(S.profile, { name: ($('#fName').value || '').trim().slice(0, 30), height: h, goal: g, days: on ? +on.dataset.v : 3, bar: $('#fBar').classList.contains('on') });
    save(); toast('Profilo salvato'); render();
  },
  start: (t) => {
    if (S.active) return go('session');
    const wid = t.dataset.v;
    if (t.closest('.seg')) { previewWid = wid; render(); return; } // solo anteprima
    previewWid = null; startSession(wid);
  },
  resume: () => { keepAwake(true); go('session'); },
  step: (t) => {
    const e = S.active.ex[S.active.idx]; const s = e.sets[+t.dataset.s]; const inf = info(SLOT[e.id], e.lvl);
    const st = inf.u === 's' ? 5 : 1; s.v = clamp(s.v + st * +t.dataset.v, 0, 999); save(); render();
  },
  setDone: (t) => {
    ensureAudio();
    const a = S.active; const e = a.ex[a.idx]; const i = +t.dataset.s; const s = e.sets[i];
    s.done = !s.done; save(); render();
    if (s.done) {
      const slot = SLOT[e.id];
      const exDone = e.sets.every((x) => x.done); const lastEx = a.idx === a.ex.length - 1;
      if (exDone && lastEx) { toast('Ultima serie fatta: termina l’allenamento!'); return; }
      let nextTxt;
      if (!exDone) nextTxt = 'Prossima: serie ' + (e.sets.findIndex((x) => !x.done) + 1) + ' di ' + e.sets.length;
      else { const n = a.ex[a.idx + 1]; nextTxt = 'Prossimo: ' + info(SLOT[n.id], n.lvl).name; }
      startRest(slot.rest, nextTxt);
    }
  },
  lvl: (t) => {
    const e = S.active.ex[S.active.idx]; const slot = SLOT[e.id]; const inf0 = info(slot, e.lvl);
    const n = clamp(e.lvl + +t.dataset.v, 0, inf0.n - 1); if (n === e.lvl) return;
    e.lvl = n; const inf = info(slot, n); e.sets.forEach((s) => { if (!s.done) s.v = inf.r[0]; });
    S.prog[pkey(slot)] = { lvl: n, last: null }; save(); render();
  },
  exNav: (t) => { const a = S.active; a.idx = clamp(a.idx + +t.dataset.v, 0, a.ex.length - 1); save(); stopRest(); render(); window.scrollTo(0, 0); },
  exInfo: () => {
    const e = S.active.ex[S.active.idx]; const slot = SLOT[e.id]; const L = LADDERS[slot.l];
    openSheet('<h3 style="margin-bottom:10px">' + esc(L.name) + '</h3>' + L.levels.map((lv, i) => '<div class="lib-lv ' + (i === e.lvl ? 'cur' : '') + '"><span class="num">' + (L.levels.length > 1 ? i + 1 : '·') + '</span><div><div class="t">' + esc(lv.n) + '</div><div class="muted small">' + esc(lv.d) + '</div></div></div>').join('') + '<div style="height:14px"></div><button class="btn ghost" data-a="closeSheet">Chiudi</button>');
  },
  sessMenu: () => openSheet('<h3 style="margin-bottom:6px">Allenamento in corso</h3><p class="muted small" style="margin-bottom:16px">Puoi uscire e riprendere più tardi dalla home.</p>' +
    '<button class="btn primary" data-a="finish">Termina e salva</button><div style="height:10px"></div>' +
    '<button class="btn ghost" data-a="leave">Esci, riprendo dopo</button><div style="height:10px"></div>' +
    '<button class="btn danger" data-a="discard">Annulla allenamento</button>'),
  leave: () => { closeSheet(); stopRest(); keepAwake(false); go('home'); },
  discard: () => { closeSheet(); stopRest(); keepAwake(false); S.active = null; save(); toast('Allenamento annullato'); go('home'); },
  finish: () => { closeSheet(); finishSession(); },
  restAdd: (t) => { if (!rest) return; rest.end += +t.dataset.v * 1000; rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000)); if (rest.end <= Date.now()) rest.end = Date.now(); tickRest(); },
  restSkip: () => stopRest(),
  weightSheet: () => {
    openSheet('<h3 style="margin-bottom:4px">Registra il peso</h3><p class="muted small" style="margin-bottom:16px">Al mattino, a digiuno, 2 volte a settimana.</p>' +
      field('fWeight', 'Peso di oggi (kg)', 'number', fmt1(curWeight()).replace(',', '.'), '', '0.1') +
      '<button class="btn primary" data-a="saveWeight">Salva</button>');
    setTimeout(() => { const i = $('#fWeight'); if (i) { i.focus(); i.select(); } }, 150);
  },
  saveWeight: () => {
    const kg = readNum('fWeight'); if (!(kg >= 30 && kg <= 200)) return toast('Inserisci un peso valido');
    const d = today(); S.weights = S.weights.filter((e) => e.d !== d); S.weights.push({ d: d, kg: Math.round(kg * 10) / 10 });
    S.weights.sort((a, b) => (a.d < b.d ? -1 : 1)); save(); closeSheet(); toast('Peso salvato'); render();
  },
  delWeight: (t) => { if (S.weights.length <= 1) return toast('Serve almeno una misurazione'); S.weights = S.weights.filter((e) => e.d !== t.dataset.v); save(); render(); },
  closeSheet: () => closeSheet(),
  export: () => {
    try {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = 'leva-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); toast('Backup esportato');
    } catch (e) { toast('Esportazione non riuscita'); }
  },
  import: () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try { const d = JSON.parse(r.result); if (!d || d.v !== 1 || !d.profile) throw new Error('bad'); S = Object.assign(fresh(), d); save(); toast('Backup importato'); go('home'); }
        catch (e) { toast('File di backup non valido'); }
      };
      r.readAsText(f);
    };
    inp.click();
  },
  resetAsk: () => openSheet('<h3 style="margin-bottom:6px">Cancellare tutti i dati?</h3><p class="muted small" style="margin-bottom:16px">Profilo, allenamenti, livelli e pesi verranno eliminati da questo telefono. Non si può annullare.</p><button class="btn danger" data-a="reset">Sì, cancella tutto</button><div style="height:10px"></div><button class="btn ghost" data-a="closeSheet">Annulla</button>'),
  reset: () => { S = fresh(); save(); closeSheet(); stopRest(); route = 'home'; render(); },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; render(); }
};


document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-a]'); if (!t || t.disabled) return;
  const fn = A[t.dataset.a]; if (fn) { ev.preventDefault(); fn(t, ev); }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target && ev.target.id === 'fWeight') A.saveWeight(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (S.active && route === 'session') keepAwake(true); tickRest(); } });
setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.active) el.textContent = mmss(Math.floor((Date.now() - S.active.start) / 1000)); }, 1000);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (route === 'profile') render(); });

if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
render();
})();
</script>
</body>
</html>
